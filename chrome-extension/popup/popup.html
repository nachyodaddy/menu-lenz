<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Antigravity Menu LENZ Helper</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0B0F17;
      color: #F8FAFC;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #22c55e, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #0B0F17;
    }
    h2 {
      font-size: 16px;
      margin: 0;
      font-weight: 700;
    }
    p {
      font-size: 11px;
      color: #94a3b8;
      margin: 2px 0 0 0;
    }
    .btn {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1px solid #1E293B;
      background-color: #131B2A;
      color: #F8FAFC;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn:hover {
      background-color: #1E293B;
      border-color: #22c55e;
    }
    .btn-primary {
      background-color: #22c55e;
      color: #0B0F17;
      border: none;
      font-weight: 800;
    }
    .btn-primary:hover {
      background-color: #16a34a;
    }
    .status {
      font-size: 10px;
      font-family: monospace;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 12px;
      text-align: center;
    }
    .box {
      background: #131B2A;
      border: 1px solid #1E293B;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">L</div>
    <div>
      <h2>Menu LENZ Extension</h2>
      <p>Antigravity IDE Companion</p>
    </div>
  </div>

  <div class="box" id="capture-status">
    Ready to capture active tab recipe or kitchen note.
  </div>

  <button class="btn btn-primary" id="btn-capture">
    📸 Ingest Active Web Page to Menu LENZ
  </button>

  <button class="btn" id="btn-sidepanel">
    📌 Open Full Menu LENZ Side Panel
  </button>

  <button class="btn" id="btn-dashboard">
    🚀 Launch Full App Dashboard
  </button>

  <div class="status">
    Connected to Local Antigravity IDE (Port 3001)
  </div>

  <script src="popup.js"></script>
</body>
</html>
