<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Menu LENZ Side Panel Companion</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: #0B0F17;
      color: #F8FAFC;
    }
    .header {
      padding-bottom: 12px;
      border-bottom: 1px solid #1E293B;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 18px;
      margin: 0;
      color: #22c55e;
    }
    p {
      font-size: 11px;
      color: #94a3b8;
      margin: 4px 0 0 0;
    }
    .card {
      background: #131B2A;
      border: 1px solid #1E293B;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #F8FAFC;
      margin-bottom: 6px;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-family: monospace;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(6, 182, 212, 0.2);
      color: #06b6d4;
    }
    iframe {
      width: 100%;
      height: 550px;
      border: none;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>Menu LENZ Side Panel</h2>
    <p>Woodlane Residential Care • Live Companion</p>
  </div>

  <div class="card">
    <div class="card-title">My25 Live Ingestion Status</div>
    <span class="badge">MY25-PASS-89210-WL</span>
    <p style="margin-top:8px;">Gemini Multimodal OCR active for handwritten note conversion and allergen compliance monitoring.</p>
  </div>

  <iframe src="http://localhost:3000"></iframe>

</body>
</html>
